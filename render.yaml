# Render Blueprint Specification for AgriSure Intelligence
services:
  - type: web
    name: agrisure-intelligence
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        value: "https://agrisure-intelligence.onrender.com"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agrisure-postgres
          property: connectionString
      - key: IOT_POLL_INTERVAL_MS
        value: 3000
      - key: DEMO_PRIMARY_PLOT
        value: "Plot #204"
      - key: DEMO_VILLAGE
        value: "Ghatal"
      - key: DEMO_DISTRICT
        value: "Ghatal, Paschim Medinipur"
      - key: SIMULATE_SENTINEL_FEEDS
        value: "true"
      - key: SIMULATE_BANK_GATEWAY
        value: "false"
      # Optional External Production Placeholders
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false

databases:
  - name: agrisure-postgres
    plan: starter
    region: oregon
    databaseName: agrisure_db
    user: agrisure_user
    ipAllowList: []
