# Render Blueprint Specification for AgriSure Intelligence
services:
  - type: web
    name: agrisure-intelligence
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agrisure-postgres
          property: connectionString
      - key: IOT_POLL_INTERVAL_MS
        value: 3000
      - key: DEMO_PRIMARY_PLOT
        value: "Plot #204"
      - key: DEMO_DISTRICT
        value: "Nadia"
      - key: SIMULATE_SENTINEL_FEEDS
        value: "true"
      - key: SIMULATE_BANK_GATEWAY
        value: "true"

databases:
  - name: agrisure-postgres
    plan: starter
    region: oregon
    databaseName: agrisure_db
    user: agrisure_user
    ipAllowList: []
